name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run ESLint
        working-directory: apps/backend
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legalbot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run database migrations
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/legalbot_test
        run: |
          npm run db:generate
          npm run db:migrate

      - name: Run tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/legalbot_test
          REDIS_URL: redis://localhost:6379
          WHATSAPP_VERIFY_TOKEN: test-token
          WHATSAPP_ACCESS_TOKEN: test-access-token
          WHATSAPP_PHONE_NUMBER_ID: "123456789"
          NODE_ENV: test
        run: npm test

      - name: Run tests with coverage
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/legalbot_test
          REDIS_URL: redis://localhost:6379
          WHATSAPP_VERIFY_TOKEN: test-token
          WHATSAPP_ACCESS_TOKEN: test-access-token
          WHATSAPP_PHONE_NUMBER_ID: "123456789"
          NODE_ENV: test
        run: npm run test:coverage

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/backend/coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Build TypeScript
        working-directory: apps/backend
        run: npm run build

      - name: Check build output
        working-directory: apps/backend
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "Error: dist/index.js not found"
            exit 1
          fi
          echo "✅ Build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: apps/backend/dist/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Run npm audit
        working-directory: apps/backend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for high severity vulnerabilities
        working-directory: apps/backend
        run: |
          npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found"
