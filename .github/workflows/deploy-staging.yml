name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch: # Permite trigger manual

jobs:
  deploy-staging:
    name: Deploy to Railway Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.legalbot.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run tests
        working-directory: apps/backend
        env:
          NODE_ENV: test
        run: npm test

      - name: Build
        working-directory: apps/backend
        run: npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          railway link ${{ secrets.RAILWAY_PROJECT_ID_STAGING }}
          railway up --service api --environment staging
        working-directory: apps/backend

      - name: Run database migrations on staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          railway run --service api --environment staging "npm run db:migrate"
        working-directory: apps/backend

      - name: Health check
        run: |
          echo "Waiting 30s for deployment to stabilize..."
          sleep 30

          STAGING_URL="${{ secrets.STAGING_URL }}"

          echo "Checking health endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" ${STAGING_URL}/healthz)

          if [ "$response" == "200" ]; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed with status $response"
            exit 1
          fi

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Deployment to staging successful!"
          echo "URL: ${{ secrets.STAGING_URL }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment to staging failed"
          exit 1

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test health endpoint
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"

          # Test /healthz
          echo "Testing GET /healthz..."
          curl -f ${STAGING_URL}/healthz || exit 1

          # Test /readyz
          echo "Testing GET /readyz..."
          curl -f ${STAGING_URL}/readyz || exit 1

          echo "✅ All smoke tests passed"

      - name: Test webhook verification
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"

          echo "Testing WhatsApp webhook verification..."
          response=$(curl -s "${STAGING_URL}/webhooks/whatsapp?hub.mode=subscribe&hub.verify_token=${{ secrets.WHATSAPP_VERIFY_TOKEN }}&hub.challenge=test123")

          if [ "$response" == "test123" ]; then
            echo "✅ Webhook verification passed"
          else
            echo "❌ Webhook verification failed"
            exit 1
          fi

      - name: Smoke tests summary
        run: |
          echo "🎉 All smoke tests passed successfully!"
          echo "Staging environment is ready for testing."
